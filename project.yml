name: Pop
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '27.0'
packages:
  TOMLDecoder:
    url: https://github.com/dduan/TOMLDecoder.git
    exactVersion: 0.4.5
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    PRODUCT_BUNDLE_IDENTIFIER: dev.eli.Pop
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Pop:
    type: application
    platform: macOS
    sources:
      - path: Pop
        excludes:
          - Pop.icon
      - path: Pop/Pop.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TOMLDecoder
    info:
      path: Pop/Info.plist
      properties:
        CFBundleDisplayName: Pop
        CFBundleIconName: Pop
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSAccessibilityUsageDescription: Read selected text to translate it when you press the shortcut.
    settings:
      base:
        PRODUCT_NAME: Pop
        ASSETCATALOG_COMPILER_APPICON_NAME: Pop
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Pop:
    build:
      targets:
        Pop: all
    run:
      config: Debug
    archive:
      config: Release
